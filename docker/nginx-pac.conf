# nginx-pac.conf
#
# Bloque de servidor para Nginx (fuera de Docker, en el propio VPS) que
# expone la plataforma PAC hacia el público, redirigiendo internamente al
# frontend (puerto 4006) y al backend/API (puerto 4005), ambos contenedores
# publicados solo en 127.0.0.1 por docker-compose.yml.
#
# INSTALACIÓN EN EL VPS:
#   1. Copia este archivo a /etc/nginx/sites-available/pac.conf
#      (o a la carpeta equivalente que ya uses para tus otros sitios, según
#      cómo tengas organizado tu Nginx en "red-de-sitios" / "root").
#   2. Reemplaza pac.tudominio.com por tu dominio o subdominio real.
#   3. Crea el enlace simbólico:
#        sudo ln -s /etc/nginx/sites-available/pac.conf /etc/nginx/sites-enabled/
#   4. Verifica la sintaxis:
#        sudo nginx -t
#   5. Recarga Nginx:
#        sudo systemctl reload nginx
#   6. Si quieres HTTPS con Let's Encrypt (recomendado) y usas certbot:
#        sudo certbot --nginx -d pac.tudominio.com
#      certbot reescribirá este bloque automáticamente para añadir TLS.

server {
    listen 80;
    listen [::]:80;
    server_name pac.tudominio.com;

    client_max_body_size 20M;   # ajusta según el tamaño máximo de evidencias que definiste en Fase 0

    # API / backend: todo lo que empiece por /api/ va al contenedor backend
    location /api/ {
        proxy_pass http://127.0.0.1:4005/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend: todo lo demás va al contenedor frontend
    location / {
        proxy_pass http://127.0.0.1:4006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
