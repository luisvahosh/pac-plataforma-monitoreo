# Orquestación de desarrollo. Levanta todo el stack con:
#   docker compose up --build
# Solo el reverse proxy (Caddy) publica puertos al host. PostgreSQL no se expone.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - interna

  frontend:
    build: ./frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "4173"
    depends_on:
      - backend
    networks:
      - interna

  backend:
    build: ./backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Recibe todos los secretos (JWT, cifrado 2FA, correo, política, etc.) del .env.
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - evidencias:/app/evidencias
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna

  worker:
    build: ./worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_INTERVALO_MS: ${WORKER_INTERVALO_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - interna

volumes:
  pg_data:
  evidencias:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
