# docker-compose.hostinger.yml
# Despliegue en Hostinger DETRÁS de Nginx Proxy Manager (NPM), que corre en su
# propio contenedor Docker sobre la red compartida "red-de-sitios_red-web".
#
# - backend y frontend se conectan TAMBIÉN a esa red compartida, para que NPM
#   pueda alcanzarlos por NOMBRE DE CONTENEDOR (pac-backend / pac-frontend) y
#   su PUERTO INTERNO (3000 / 4173) — no por IP pública ni puerto publicado.
# - Los puertos 127.0.0.1 se mantienen solo para pruebas/depuración locales
#   por SSH (curl); no son necesarios para que NPM funcione.
# - PostgreSQL y worker permanecen SOLO en la red interna (nunca expuestos).
#
# En Nginx Proxy Manager, el Proxy Host debe usar:
#   Forward Hostname/IP = pac-frontend   Forward Port = 4173
#   Custom Location /api -> Forward Hostname/IP = pac-backend   Forward Port = 3000

name: pac

services:
  backend:
    build: ./backend
    container_name: pac-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      RETO_2FA_TTL: ${RETO_2FA_TTL:-5m}
      REFRESH_TOKEN_TTL_DIAS: ${REFRESH_TOKEN_TTL_DIAS:-7}
      CIFRADO_2FA_SECRET: ${CIFRADO_2FA_SECRET}
      PASSWORD_MIN_LONGITUD: ${PASSWORD_MIN_LONGITUD:-10}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS:-15}
      CORREO_MODO: ${CORREO_MODO:-dev}
      CORREO_REMITENTE: ${CORREO_REMITENTE}
      MS_GRAPH_TENANT_ID: ${MS_GRAPH_TENANT_ID}
      MS_GRAPH_CLIENT_ID: ${MS_GRAPH_CLIENT_ID}
      MS_GRAPH_CLIENT_SECRET: ${MS_GRAPH_CLIENT_SECRET}
      MS_GRAPH_SENDER: ${MS_GRAPH_SENDER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      APP_URL: ${APP_URL}
      EVIDENCIAS_DIR: /app/evidencias
      EVIDENCIAS_MAX_MB: ${EVIDENCIAS_MAX_MB:-25}
      EVIDENCIAS_EXT: ${EVIDENCIAS_EXT:-pdf,png,jpg,jpeg,gif,webp,docx,xlsx,pptx,txt,csv}
    volumes:
      - evidencias:/app/evidencias
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4005}:3000"
    networks:
      - interna
      - red-de-sitios_red-web

  worker:
    build: ./worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_INTERVALO_MS: ${WORKER_INTERVALO_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna

  frontend:
    build: ./frontend
    container_name: pac-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4006}:4173"
    networks:
      - interna
      - red-de-sitios_red-web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - interna

volumes:
  pg_data:
  evidencias:

networks:
  interna:
    driver: bridge
  red-de-sitios_red-web:
    external: true
