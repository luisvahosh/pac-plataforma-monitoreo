# infra/nginx-pac.conf
# Bloque de servidor para el nginx del HOST (fuera de Docker) que expone la
# plataforma PAC. Reenvía al frontend y al backend, publicados en 127.0.0.1 por
# docker-compose.hostinger.yml.
#
# INSTALACIÓN EN EL VPS:
#   1. sudo cp infra/nginx-pac.conf /etc/nginx/sites-available/pac.conf
#   2. Reemplaza pac.tudominio.com por tu dominio/subdominio real.
#   3. Ajusta los puertos (4005/4006) si cambiaste BACKEND_PORT/FRONTEND_PORT.
#   4. sudo ln -s /etc/nginx/sites-available/pac.conf /etc/nginx/sites-enabled/
#   5. sudo nginx -t   &&   sudo systemctl reload nginx
#   6. HTTPS con Let's Encrypt:  sudo certbot --nginx -d pac.tudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name pac.tudominio.com;

    # Debe ser >= EVIDENCIAS_MAX_MB (por defecto 25 MB) para permitir subir evidencias.
    client_max_body_size 30M;

    # API / backend. IMPORTANTE: proxy_pass SIN barra final para CONSERVAR el
    # prefijo /api que el backend NestJS requiere (app.setGlobalPrefix('api')).
    location /api/ {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (todo lo demás).
    location / {
        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
